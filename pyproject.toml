[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qdebug"
version = "0.1.0"
description = "Quantum circuit debugger + regression tester: separates logic bugs from noise on IonQ simulators"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "qiskit>=1.3",
    "numpy",
]

[project.optional-dependencies]
local = ["qiskit-aer"]
ionq = ["qiskit-ionq>=1.0"]
plot = ["matplotlib"]
dev = ["pytest"]
all = ["qiskit-aer", "qiskit-ionq>=1.0", "matplotlib", "pytest"]

[project.scripts]
qdebug = "qdebug.cli:main"

[tool.setuptools.packages.find]
include = ["qdebug*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore"]
addopts = "-m 'not slow and not ionq'"
markers = [
    "slow: long statistical runs (select with -m slow)",
    "ionq: needs a real IONQ_API_KEY and network (select with -m ionq)",
]
